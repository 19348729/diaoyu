# ──────────────────────────────────────────────
#  Nginx 反向代理配置 — ks.gzbaoge.com
# ──────────────────────────────────────────────
#  复制到: /etc/nginx/conf.d/fishapp.conf
#  SSL 证书已由用户在 Nginx 层面配置完毕，
#  此处仅配置 location 反向代理规则。
#  若已有 server {} 块包含 SSL 配置，
#  将下面 location 块合并进去即可。
# ──────────────────────────────────────────────

# 如果你需要一个独立的 server 块，取消注释以下内容：
# server {
#     listen 443 ssl http2;
#     server_name ks.gzbaoge.com;
#
#     ssl_certificate     /path/to/fullchain.pem;
#     ssl_certificate_key /path/to/privkey.pem;
#
#     # 以下 location 块粘贴进去 ↓
# }

# ── 核心 location 规则（合并到你现有的 server 块中） ──

# API 反向代理
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时
    proxy_connect_timeout 30s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # 请求体限制（批量传感器数据）
    client_max_body_size 10M;
}

# 健康检查（关闭 access log 减少噪音）
location /health {
    proxy_pass http://127.0.0.1:8000/health;
    access_log off;
}

# Swagger 文档（可选，生产环境可注释掉）
location /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    proxy_set_header Host $host;
}
